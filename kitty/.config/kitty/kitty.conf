# The basic colors
foreground              #cdd6f4
background              #1e1e2e
selection_foreground    #1e1e2e
selection_background    #f5e0dc

# Cursor colors
cursor                  #f5e0dc
cursor_text_color       #1e1e2e

# URL underline color when hovering with mouse
url_color               #f5e0dc

# Kitty window border colors
active_border_color     #b4befe
inactive_border_color   #6c7086
bell_border_color       #f9e2af

# OS Window titlebar colors
wayland_titlebar_color system
macos_titlebar_color system

# Tab bar colors
active_tab_foreground   #11111b
active_tab_background   #cba6f7
inactive_tab_foreground #cdd6f4
inactive_tab_background #181825
tab_bar_background      #11111b

# Colors for marks (marked text in the terminal)
mark1_foreground #1e1e2e
mark1_background #b4befe
mark2_foreground #1e1e2e
mark2_background #cba6f7
mark3_foreground #1e1e2e
mark3_background #74c7ec

# The 16 terminal colors

# black
color0 #45475a
color8 #585b70

# red
color1 #f38ba8
color9 #f38ba8

# green
color2  #a6e3a1
color10 #a6e3a1

# yellow
color3  #f9e2af
color11 #f9e2af

# blue
color4  #89b4fa
color12 #89b4fa

# magenta
color5  #f5c2e7
color13 #f5c2e7

# cyan
color6  #94e2d5
color14 #94e2d5

# white
color7  #bac2de
color15 #a6adc8

# Transparency settings
background_opacity 0.9

# fonts
font_family	JetBrainsMono Nerd Font Mono
bold_font	JetBrainsMono Nerd Font Mono Extra Bold
bold_italic	JetBrainsMono Nerd Font Mono Extra Bold Italic
italic_font	JetBrainsMono Nerd Font Mono Italic

font_size 9.0

# Slightly increases row spacing so icons and text have breathing room
modify_font underline_position -2
modify_font underline_thickness 150%
adjust_line_height  110%

# Disable ligatures when hovering with cursor to prevent weird spacing glitches
disable_ligatures cursor

window_padding_width 12

# Hide window decorations for a seamless borderless aesthetic
hide_window_decorations yes

# Keep a consistent layout when opening splits
enabled_layouts splits,stack

# Cursor customization
cursor_shape block
cursor_blink_interval 0.5
cursor_trail 3
cursor_trail_decay 0.1 0.4

# Mouse settings
copy_on_select yes
detect_urls yes
mouse_hide_wait 3.0

# Tab bar settings
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style round
tab_title_template "{title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}"

# Bell settings
enable_audio_bell no
visual_bell_duration 0.0
window_alert_on_bell yes